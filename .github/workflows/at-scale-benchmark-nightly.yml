name: At-Scale Benchmark (nightly)

# Runs the at-scale code-graph benchmark tier (evals/at_scale/, issue #120) against
# this repo's own history every night. Purpose: catch runtime failures in the
# ingestion/query-benchmark harness itself (crashes, hangs, broken assumptions as
# this repo's real history grows) -- not benchmark-number regressions. The tier is
# deliberately observational (see evals/at_scale/benchmark.md), so this workflow
# does not gate on or compare any metric; it only fails if either script exits
# non-zero.
#
# ALERTING (#295). This used to rely on "GitHub's own default workflow failure
# notifications", with no extra alerting wired up. That assumption failed
# silently and expensively: the job was red for 21 CONSECUTIVE NIGHTS
# (2026-08-11 .. 2026-08-31) and nobody noticed. Both underlying bugs were
# reported correctly by CI every single night -- detection worked, delivery did
# not. The cost was not cosmetic: this nightly is the only signal that would
# catch a regression from the minigraf 2.0.0 upgrade (#284), and it was
# unusable for exactly the period that mattered.
#
# So a failure now FILES AN ISSUE. Three properties make that useful rather
# than just louder:
#
#   1. It DEDUPES. Filing one issue per red night would have produced 21 issues
#      for that streak, which is worse than silence -- that volume is precisely
#      what gets muted. An existing open `nightly-failure` issue gets a comment
#      instead.
#   2. It CLOSES ITSELF on green, so the issue's state answers "is the nightly
#      broken right now?". Without this the issue outlives the fix and dedupe
#      just makes staleness quieter.
#   3. It is TESTABLE on demand via the simulate_failure input below, so the
#      path can be exercised before it is ever needed. A notifier nobody has
#      watched fire is the exact shape of the thing that just failed for three
#      weeks.
#
# WHAT THIS STILL DOES NOT CATCH -- read this before treating silence as green.
# The issue is filed by a STEP INSIDE THE RUN, so it can only report failures
# that happen once the run is underway. It is blind to:
#
#   * A run that never starts. A YAML syntax error in this file, the workflow
#     being disabled (GitHub auto-disables scheduled workflows in repos with no
#     activity for 60 days), a deleted/renamed default branch, or the schedule
#     silently not firing all produce NO run and therefore NO issue.
#   * The job failing before its first step -- runner unavailable, the
#     `runs-on` image being retired, a permissions change revoking issues:write.
#   * The notifier itself failing. If `gh` errors, the run is red and nothing
#     is filed. There is no second channel to report that; the recursion has to
#     stop somewhere.
#
# In all of those cases this workflow is silent, and silence is exactly what it
# looks like when everything is fine. The only thing that closes that gap is a
# check EXTERNAL to this run -- something that notices the absence of a nightly
# result rather than the presence of a failure. That does not exist here, and
# is deliberately not pretended otherwise: #295's whole lesson was that an
# assumed notification channel had never been verified.
#
# NOT ALL THREE STEPS MEAN THE SAME THING WHEN RED. Ingestion and the query
# benchmark failing means the HARNESS broke. The ident-collision census failing
# means the harness worked and found something: two entities on real history
# sharing one ident, which reopens #263's rule choice (#267). The issue body
# below names which step it was for exactly that reason.

on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC daily
  workflow_dispatch:     # allows manual runs to verify the workflow itself
    inputs:
      simulate_failure:
        description: "Force the benchmark step to fail, to exercise the issue-filing path end to end"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write  # #295: the failure path files/comments/closes an issue

jobs:
  at-scale-benchmark:
    runs-on: ubuntu-latest
    # 360 minutes is GitHub's ceiling for hosted runners, and it is deliberate
    # rather than generous. This job budgeted 30 minutes and was CANCELLED every
    # night from 2026-08-03 to 2026-08-07 for exceeding it -- ingestion alone
    # measured 3009s (50.2 min) locally for 626 commits on 2026-08-07, on
    # hardware faster than a hosted runner, and the query benchmark runs after
    # it. Ingestion cost grows with this repo's commit count (and superlinearly
    # with graph size -- see #241), so any tight budget is a recurring failure
    # waiting to happen; the ceiling is the only value that does not need
    # revisiting on a schedule.
    #
    # Accepted trade-off: a genuinely hung run now burns up to 6h of Actions
    # time before failing, where it used to surface in 30 minutes. That is
    # tolerable because the known hang cause -- the in-flight poller starving
    # the ingestion it measured (#242) -- is fixed, and the poll duty cycle is
    # now recorded in each entry so a recurrence is visible in the numbers.
    #
    # Revisit by splitting ingestion and the query benchmark into separate jobs
    # if the pair stops fitting, rather than by trimming this back.
    timeout-minutes: 360
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          # Both benchmarks need real git history: the ingestion benchmark walks
          # this repo's full commit log, and the query benchmark ingests through
          # a pinned historical commit (evals/at_scale/query_ground_truth.json's
          # pinned_commit) that a shallow (depth-1) clone would not even contain.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,git-ingestion]"

      - name: Add project to PYTHONPATH
        run: echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV

      - name: Simulate a failure (manual dispatch only)
        # Exercises the issue-filing path below without waiting for a real
        # breakage, and without touching the benchmark scripts. Cannot fire on
        # a scheduled run: `inputs` is empty there, so the expression is false.
        if: inputs.simulate_failure
        run: |
          echo "simulate_failure=true -- failing deliberately to exercise the notifier"
          exit 1

      # #330. THERE IS DELIBERATELY NO --branch HERE. This step carried
      # `--branch HEAD` for months. That is truthy, so it does not select the
      # checked-out ref *in addition to* the harness's own resolution -- it
      # DEFEATS `branch or mcp_server._default_git_branch(repo_path)`
      # (run_ingestion_benchmark.py) outright, and the literal reaches
      # _git_commits' range spec, _run_ingestion's repo_total and #317's
      # commit census alike.
      #
      # The failure that produces is quiet, not loud, which is why it survived
      # this long: everything downstream inherits the SAME wrong ref, so no
      # count in the tier disagrees with another. They simply all describe
      # whatever happens to be checked out rather than the branch being
      # tracked. On a scheduled run those denote the same commit and nothing
      # is wrong; on a workflow_dispatch against a branch, a tag, or any
      # detached checkout they do not. #317 caught the identical shape in
      # _run_ingestion only because the harness resolved "master" while the
      # checkout sat on a feature branch, making two numbers that should have
      # matched differ.
      #
      # Omitting the argument is what lets _default_git_branch resolve it.
      # main() now refuses the literal outright, so re-adding it turns this
      # step red rather than quiet -- but the argument is easier not to add
      # than to debug, hence this note.
      - name: Run ingestion benchmark
        id: ingestion
        run: python -m evals.at_scale.run_ingestion_benchmark --repo-path .

      - name: Run query-correctness benchmark
        id: query
        if: always()
        run: python -m evals.at_scale.run_query_benchmark --repo-path .

      # #267. R3's zero ident-collision residual is MEASURED over history, not
      # proven by construction (see _canonical_ident), so it can be falsified by
      # a commit landing tomorrow. The in-suite guard is a fixed 9-pair corpus
      # and catches only a REGRESSION in the rule; this is the census that can
      # discover something new.
      #
      # --fail-on-collision is passed HERE and nowhere else. The probe's default
      # is exit 0, because finding a collision is a measurement rather than an
      # invalid run -- but a finding that only lands in a green run's log is the
      # exact shape of the undelivered detection #295 was about. The flag is
      # what routes it into the issue-filing path below.
      #
      # `if: always()` so a red ingestion or query step does not hide it: the
      # three steps fail for unrelated reasons. Cost is ~97s over 835 commits
      # (2026-09-01) against this job's 360-minute ceiling, which is why it runs
      # over FULL history with no --since bound -- and a bound would be wrong
      # anyway, since the collision it is hunting is a new entity against an old
      # one.
      - name: Census ident collisions under the shipped rule
        id: census
        if: always()
        run: |
          python evals/at_scale/probe_ident_collision_new_history.py \
            --repo-path . --fail-on-collision

      # #325. `commit_census` above runs INSIDE `run_ingestion_benchmark`,
      # which ingests once into a fresh graph -- no persisted frontier
      # interval ever exists there for `_frontier_load` to retain, so a
      # WRONGLY-retained interval (silent, permanent commit loss on resume)
      # is invisible to that step, and to every other detector here:
      # fact_audit's two witnesses agree about a commit neither holds, both
      # :introduced-by checks only examine entities that exist, and
      # stderr_capture has nothing to read. This probe is the only one that
      # ingests, then RESUMES into the SAME graph, so it is the only one that
      # can reach the branch #325 touched.
      #
      # BOUNDED TO A FIXED SLICE OF HISTORY, NOT THE FULL BRANCH TIP. Ingestion
      # cost here grows superlinearly with graph size (#241, #280) -- measured
      # directly while choosing this bound: 50 commits/3.1s, 200/26.4s,
      # 300/100.2s on this repo's own history. The first (truncated) ingestion
      # pays close to the FULL cost of walking history up to the target ref
      # regardless of --truncate-by, since --truncate-by only trims the tip;
      # pointing at the full (900+ and growing) branch tip would roughly
      # double the existing ingestion step's own already-substantial cost
      # inside this job's shared 360-minute ceiling, and that cost grows every
      # night. The 300th commit from repo root is meant to be a fixed
      # position that does not drift forward as history grows, so this bound
      # needs no periodic recalibration -- but that guarantee depends on
      # ordering by the same rule ingestion itself uses.
      # `git log --reverse` with NO `--topo-order` orders by commit DATE, not
      # topology: merging a long-lived branch whose commits carry OLDER
      # timestamps than trunk would insert them below position 300 and shift
      # the slice out from under this step, silently, the next time it runs
      # -- even though nothing about trunk's own history changed. `git log
      # --topo-order --reverse` is what `build_linearization` (the code path
      # this whole nightly measures) actually walks, per CLAUDE.md's #316/
      # #317 notes, so `--topo-order` here makes "the 300th commit" track the
      # same position ingestion would ever assign it, immune to a date-order
      # merge doing this. See evals/at_scale/benchmark.md for the measured
      # baseline this produced.
      #
      # --fail-on-mismatch is passed HERE, unlike the initial measurement that
      # chose this baseline (results/325-resume-census.json): repo_vs_graph
      # was confirmed 0 against a nonzero repo_commits before this flag was
      # added, per CLAUDE.md's rule against gating on a prediction. A
      # census_error fails the step regardless of the flag (see
      # probe_resume_census.py's main()).
      #
      # COVERAGE RESIDUAL OF THE FROZEN SLICE -- read before treating a green
      # run here as full coverage. --branch/--truncate-by are pinned, so every
      # night replays an IDENTICAL scenario: enough to catch a REGRESSION in
      # the retention predicate itself (pre-#325 discard-on-tip-growth
      # reappearing), but this step can NEVER observe a newly landed commit
      # arriving INSIDE an already-retained interval's bounds -- the exact
      # case the interval's `:pos-count` checksum exists to catch. The
      # ident-collision census immediately above this one deliberately
      # carries no --since bound for the matching reason (its own comment:
      # the pair to worry about is new-vs-old, and a bounded collection would
      # see only new-vs-new); this step's fixed slice is the opposite trade,
      # accepted here for the ingestion-cost reasons above, not free of a
      # residual the way that unbounded census is.
      - name: Census a resumed graph for a wrongly-retained frontier interval
        id: resume_census
        if: always()
        run: |
          # #330. Resolved through the SHIPPED helper, not `git rev-parse
          # --abbrev-ref HEAD`, which is what this line used to run. That
          # prints the literal string HEAD on a detached checkout -- the one
          # value probe_resume_census's own --branch help text forbids -- and
          # on a workflow_dispatch against a branch it prints the FEATURE
          # branch, which is #317's scenario verbatim. Either way the slice
          # below would be taken from a different linearization than the code
          # under measurement walks, silently. _default_git_branch is the
          # resolution ingestion itself performs, so this tracks it by
          # construction instead of by a matching guess.
          resolved_branch=$(python -c "import mcp_server; print(mcp_server._default_git_branch('.'))")
          target_ref=$(git log --topo-order --reverse --format=%H "$resolved_branch" | sed -n '300p')
          python evals/at_scale/probe_resume_census.py \
            --repo . --branch "$target_ref" \
            --graph "${{ runner.temp }}/325-resume-census.graph" \
            --truncate-by 30 --fail-on-mismatch

      # --- #295 alerting -------------------------------------------------
      # `failure() || cancelled()` rather than just `failure()`: a cancelled
      # run is a real signal here, not noise. This job was CANCELLED nightly
      # from 2026-08-03 to 2026-08-07 for blowing its old 30-minute budget,
      # which is exactly the kind of "never reached a verdict" outcome that
      # should reach a human.
      - name: File or update the failure issue
        if: (failure() || cancelled()) && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INGESTION_OUTCOME: ${{ steps.ingestion.outcome }}
          QUERY_OUTCOME: ${{ steps.query.outcome }}
          CENSUS_OUTCOME: ${{ steps.census.outcome }}
          RESUME_CENSUS_OUTCOME: ${{ steps.resume_census.outcome }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Naming WHICH half broke matters: this session established that the
          # ingestion and query steps fail for unrelated reasons with opposite
          # fixes, and conflating them sent an investigation at the wrong
          # commit. An outcome of "" means the step never ran.
          body=$(printf '%s\n' \
            "The at-scale nightly failed." \
            "" \
            "| | |" \
            "|---|---|" \
            "| Run | $RUN_URL |" \
            "| Trigger | \`$EVENT\` |" \
            "| Ingestion step | \`${INGESTION_OUTCOME:-did not run}\` |" \
            "| Query step | \`${QUERY_OUTCOME:-did not run}\` |" \
            "| Ident-collision census | \`${CENSUS_OUTCOME:-did not run}\` |" \
            "| Resume-census (frontier retention) | \`${RESUME_CENSUS_OUTCOME:-did not run}\` |" \
            "" \
            "These steps fail for unrelated reasons and want opposite fixes" \
            "(#295) -- read the outcomes above before assuming which one broke." \
            "" \
            "A red ident-collision census is NOT a harness failure: it means" \
            "real history produced two entities sharing one \`_code_ident\`," \
            "which reopens #263's rule choice. The run's log names the" \
            "colliding pairs." \
            "" \
            "A red resume-census means a resumed ingestion into an already-" \
            "populated graph is missing a commit the repo has -- #325's" \
            "frontier-interval retention predicate wrongly kept an interval" \
            "that should have been discarded. The run's log carries the full" \
            "repo/walk/graph counts." \
            "" \
            "This issue is filed and closed automatically by" \
            "\`.github/workflows/at-scale-benchmark-nightly.yml\`. While it stays" \
            "open, later failures are added as comments rather than new issues;" \
            "it closes itself on the first green run.")

          existing=$(gh issue list --label nightly-failure --state open \
                       --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "Existing open issue #$existing -- commenting instead of filing a duplicate."
            printf '%s\n' "$body" | gh issue comment "$existing" --body-file -
          else
            printf '%s\n' "$body" | gh issue create \
              --title "At-scale nightly failed" \
              --label nightly-failure \
              --body-file -
          fi

      - name: Close the failure issue on a green run
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Without this the issue outlives the fix and its state stops
          # answering "is the nightly broken right now?" -- which is the only
          # question this whole mechanism exists to answer.
          existing=$(gh issue list --label nightly-failure --state open \
                       --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" \
              --comment "The at-scale nightly is green again: $RUN_URL"
            echo "Closed #$existing."
          else
            echo "No open nightly-failure issue; nothing to close."
          fi
