[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-reasoning"
version = "0.0.0"  # stamped from .claude-plugin/plugin.json by CI
description = "Perfect memory. Exact reasoning. Complete history. Bi-temporal graph memory for AI coding agents."
readme = "README.md"
license = {text = "MIT"}
# Deliberately unbounded above, and the bound below is the real claim: every
# released interpreter from 3.10 up is exercised by .github/workflows/pytest.yml
# and the classifiers below list exactly that set. See "Python Version Support"
# in CLAUDE.md for why an unbounded ceiling is the honest choice here and what
# to do when a new interpreter ships (#331).
requires-python = ">=3.10"
authors = [
    {name = "Aditya Mukhopadhyay", email = "webmaster@adityamukho.com"}
]
keywords = ["ai-agents", "graph-database", "datalog", "knowledge-graph", "persistent-memory", "temporal-reasoning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    # Floor is a correctness requirement, not a preference. Before the
    # project-minigraf/minigraf#304 fix, FileLock::acquire treated a lock held
    # by our own PID as stale and opened anyway, so a second handle on one file
    # was created silently. Two handles each cache their own page_count and
    # corrupt each other -- the flaky "Page N out of bounds" of #251/#253.
    # mcp_server reaches that state through normal operation, so an older
    # minigraf here means silent graph corruption under concurrent load. That
    # fix shipped in 1.2.2 and is present in every release since.
    #
    # Raised to 2.0.0 in #284 item 6, after the whole tier was re-verified
    # against a real 2.0.0 build rather than reasoned about:
    #   * Suite green on BOTH versions (1599 passed each). The four sidecar
    #     tests that blocked this were rewritten in #293 to assert exclusivity
    #     against the OS instead of a `.graph.lock` file that 2.0.0 does not
    #     write -- and nine more assertions had silently become TAUTOLOGIES
    #     under kernel locking, which the file-based form could not have caught.
    #   * The #108 ingestion pre-check, which 2.0.0 silently turned into a
    #     no-op, was rebuilt on a portable ownership hint (#292).
    #   * Every minigraf error string we match was audited against v2.0.0
    #     source (#296).
    #   * At-scale benchmark on both: wall clock within 1.5%, checkpoint
    #     accounting identical, query correctness identical (#294).
    #
    # The last stated blocker, project-minigraf/minigraf#287 (batching facts
    # that share entity+attribute loses all but one), is still OPEN -- and is
    # NOT a reason to hold the cap, because it is VERSION-INVARIANT. Measured:
    # it reproduces identically on 1.2.3 and 2.0.0, and this repo's per-fact
    # transact workaround neutralises it identically on both. #83's other two
    # gates (minigraf#297, #298) are CLOSED upstream.
    #
    # Capped below 3.0 deliberately. Upstream's 3.0.0 milestone is format v8 +
    # window completeness + FFI expansion; a major bump must be a decision, not
    # a resolver outcome. That is the whole lesson of this cap's own history:
    # with no upper bound, CI silently resolved 2.0.0 the day it shipped and
    # ran red for days before anyone connected the two (#286).
    "minigraf>=2.0.0,<3.0.0",
    # Capped below 2.0: mcp 2.0.0 removed Server.list_tools, which
    # mcp_server.py registers its handlers through. With the bound open, CI
    # resolved 2.0.0 and every test that imports mcp_server errored at import
    # (902 of them). Migrating to the 2.x handler API is its own change --
    # raise the cap as part of that, not before it.
    "mcp>=1.27.0,<3.0.0",
]

[project.scripts]
temporal-reasoning = "mcp_server:run"

[project.optional-dependencies]
git-ingestion = [
    "tree-sitter>=0.22.0",
    "tree-sitter-rust", "tree-sitter-python", "tree-sitter-javascript",
    "tree-sitter-typescript", "tree-sitter-go", "tree-sitter-java",
    "tree-sitter-c", "tree-sitter-cpp",
    "tree-sitter-c-sharp", "tree-sitter-ruby", "tree-sitter-php",
    "tree-sitter-kotlin", "tree-sitter-swift", "tree-sitter-scala",
    "tree-sitter-haskell", "tree-sitter-lua", "tree-sitter-elixir",
]
llm = ["anthropic>=0.40.0"]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.23.0",
    "black>=25.11.0",
    "ruff>=0.15.12",
]

[tool.setuptools]
# Hand-maintained, and it has to be: the repo is a flat module layout with no
# package directory, so setuptools discovers nothing on its own. A module
# missing here imports fine in every checkout and every CI run (repo root is
# on sys.path) and raises ModuleNotFoundError in the built wheel --
# frontier_registry did exactly that from 2026-07-24 until #82.
# tests/test_packaging.py walks the shipped modules' imports and fails if this
# list does not cover them.
py-modules = ["mcp_server", "report_issue", "fact_index", "frontier_registry", "ingest_progress"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pylint.messages_control]
max-line-length = 100
disable = ["C0111", "C0301", "C0303", "C0411", "C0413", "C0415", "R0801", "W0212", "W0611", "W0621"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
